[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["backend/migrations"]

[tool.ruff.lint]
# Starting with the rules that catch real defects rather than style opinions:
# pyflakes (dead code, undefined names), import ordering, and the pycodestyle
# errors that are not purely cosmetic.
select = ["E", "F", "I", "W"]

# E501 (line length) is excluded rather than enforced: the existing code has
# ~190 long lines, most of them readable one-line dict literals and log
# messages. Reformatting them all would bury real changes in noise.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
