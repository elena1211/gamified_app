name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DATABASE_URL: "sqlite:///:memory:"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Catches a model change whose migration was never generated — which
      # would otherwise only surface as a warning in local test output.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      # Runs with production-shaped settings, so the SECURE_* block is actually
      # exercised. Warnings fail the build; the two deliberate ones are
      # silenced in settings.py with the reasoning next to them.
      - name: Django deployment checks
        env:
          DEBUG: "0"
          SECRET_KEY: ci-deploy-check-key-long-enough-to-satisfy-the-w009-check
          DATABASE_URL: "postgres://user:pass@localhost:5432/placeholder"
          ALLOWED_HOSTS: "example.com"
        run: python manage.py check --deploy --fail-level WARNING
      # Runs the suite under coverage so the figure is measured on every PR
      # rather than whenever someone remembers. The floor is in pyproject.toml.
      - name: Tests with coverage
        run: |
          coverage run manage.py test backend
          coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage
      - run: npm run build

  # Production runs PostgreSQL, and the Procfile applies migrations when the
  # web process starts, so a migration that only works on SQLite would stop
  # the app from booting. This job runs the suite on PostgreSQL and checks
  # the newest migration can be rolled back and re-applied there.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: levelup
          POSTGRES_PASSWORD: levelup
          POSTGRES_DB: levelup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DATABASE_URL: "postgres://levelup:levelup@localhost:5432/levelup_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply every migration
        run: python manage.py migrate --noinput
      - name: Roll the newest migration back and forward
        run: |
          newest=$(ls backend/migrations/0*.py | sort | tail -n 1 | xargs basename | cut -d_ -f1)
          previous=$(ls backend/migrations/0*.py | sort | tail -n 2 | head -n 1 | xargs basename | cut -d_ -f1)
          python manage.py migrate backend "$previous" --noinput
          python manage.py migrate backend "$newest" --noinput
      - name: Tests on PostgreSQL
        run: python manage.py test backend
