name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DATABASE_URL: "sqlite:///:memory:"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Catches a model change whose migration was never generated — which
      # would otherwise only surface as a warning in local test output.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      # Runs with production-shaped settings, so the SECURE_* block is actually
      # exercised. Warnings fail the build; the two deliberate ones are
      # silenced in settings.py with the reasoning next to them.
      - name: Django deployment checks
        env:
          DEBUG: "0"
          SECRET_KEY: ci-deploy-check-key-long-enough-to-satisfy-the-w009-check
          DATABASE_URL: "postgres://user:pass@localhost:5432/placeholder"
          ALLOWED_HOSTS: "example.com"
        run: python manage.py check --deploy --fail-level WARNING
      # Runs the suite under coverage so the figure is measured on every PR
      # rather than whenever someone remembers. The floor is in pyproject.toml.
      - name: Tests with coverage
        run: |
          coverage run manage.py test backend
          coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - run: npm test
      - run: npm run build
